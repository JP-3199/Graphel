<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Contáctanos</title>
</head>
<body>
    
    <!-- ===== MENÚ SUPERIOR (HEADER) ===== -->
    <header class="header">
        <div class="header__contenedor">

            <!-- Logo / nombre de la marca -->
            <div class="header__logo">
                Diseño <span>Multimedia</span>
            </div>

            <!-- Menú de navegación -->
            <nav class="menu">
                <ul class="menu__lista">
                    <li><a href="#" class="menu__link">Inicio</a></li>
                    <li><a href="#" class="menu__link">Nosotros</a></li>
                    <li><a href="#" class="menu__link">Servicios</a></li>
                    <li><a href="#" class="menu__link">Contacto</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <section class="boletin">
        <h2>Suscibete a nuestro boletin</h2>

        <form action="#">
            <input type="email" name="email" placeholder="Ingrese el Email...">
            <button type="submit">Subscribete</button>
        </form>
    </section>

    <footer class="footer">
        <p>Graphel Desarrollo Web, Copyright &copy; 2017</p>
    </footer>


</body>
</html>
